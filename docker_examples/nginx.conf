user  nginx;

events {
  worker_connections   1000;
}

http {
  # el DNS interno de docker, que resuelve los nombres de los servicios a las
  # ips de sus contenedores
  resolver 127.0.0.11 valid=5s;

  server {
    listen 5000;
    location / {
      # usamos una variable como destino: si escribimos el nombre directo,
      # nginx lo resuelve una sola vez al arrancar y no se entera de los
      # contenedores nuevos que aparecen al escalar el servicio
      set $backend http://web:5000;
      proxy_pass $backend$request_uri;
    }
  }
}
